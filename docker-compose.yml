version: '3.4'
services:
  traefik:
    image: traefik:v2.10.4
    container_name: traefik
    restart: unless-stopped
    networks:
      - sqldb
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlsresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlsresolver.acme.email=morgane.roques@irt-saintexupery.com"
      - "--certificatesresolvers.mytlsresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"  # Expose Traefik on port 8000    
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "./letsencrypt:/letsencrypt"
  sqldbui:
    image: irtse/sqldbui
    container_name: sqldbui
    ports: 
      - 8082:80
    networks:
      - sqldb
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.front.entrypoints=websecure"
        - "traefik.http.routers.front.rule=Host(`${HOST:-capitalisation.irt-aese.local}`) && PathPrefix(`/`)"
        - "traefik.http.routers.front.tls.certresolver=mytlsresolver"
        - "traefik.http.services.front.loadbalancer.server.port=80"
networks:
  sqldb:
    external: true