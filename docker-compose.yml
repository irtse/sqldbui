version: '3.4'
services:
  traefik:
    image: traefik:v2.10.4
    container_name: traefik
    restart: unless-stopped
    networks:
      - sqldb
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"  # Expose Traefik on port 8000    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  sqldbui:
    image: irtse/sqldbui
    container_name: sqldbui
    ports: 
      - 8081:80
    networks:
      - sqldb
    environment:
      HOST: ${HOST:-http://capitalisation.irt-aese.local/sqldb}
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.front.entrypoints=web"
        - "traefik.http.routers.front.rule=PathPrefix(`/`)"
        - "traefik.http.services.front.loadbalancer.server.port=80"
networks:
  sqldb:
    external: true