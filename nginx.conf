server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ Serve assets directly as static files
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ✅ Handle Flutter web routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
